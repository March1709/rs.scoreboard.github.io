        /**
         * CSVの各行からチーム番号とチーム名を取り出し、選択肢用データへ変換する。
         * 1列目をチーム番号、2列目をチーム名として扱い、見出し行や空欄は無視する。
         * @param {string} csvData - UTF-8で読み込んだCSV文字列。
         * @returns {{value: string, text: string}[]} selectへ投入できるチーム情報。
         */
        function parseTeamCsv(csvData) {
            const lines = csvData.split(/\r\n|\n/);
            const parsedTeams = [];

            lines.forEach(line => {
                const columns = line.split(',');
                if (columns[0] && columns[0].trim() !== "" && columns[1] && columns[1].trim() !== "") {
                    const teamNumber = columns[0].replace(/^\uFEFF/, '').trim();
                    const teamName = columns[1].trim();
                    if (teamNumber === 'チーム番号' && teamName === 'チーム名') return;
                    parsedTeams.push({ value: teamNumber, text: `${teamNumber} - ${teamName}` });
                }
            });

            return parsedTeams;
        }

        /**
         * 固定チームリストの読み込み状態をチーム選択画面へ表示する。
         */
        function updateFixedTeamListStatus(message, isError) {
            const status = document.getElementById('fixedTeamListStatus');
            if (!status) return;
            status.textContent = message;
            status.style.color = isError ? 'red' : '';
        }

        /**
         * 同梱の奈良大会用CSVを取得し、チーム選択欄へ反映する。
         */
        async function loadFixedTeamList() {
            updateFixedTeamListStatus('奈良大会チームリストを読み込んでいます...', false);

            try {
                const response = await fetch(FIXED_TEAM_LIST_CSV_PATH, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                teamListFromCsv = parseTeamCsv(await response.text());
                if (teamListFromCsv.length === 0) {
                    throw new Error('有効なチーム情報がありません');
                }

                initializeTeamSelectionUI();
                updateFixedTeamListStatus(`${teamListFromCsv.length}チームから選択できます。`, false);
            } catch (error) {
                console.error('固定チームリスト読み込みエラー:', error);
                if(teamSelectDropdownsContainer) teamSelectDropdownsContainer.classList.add('hidden');
                updateFixedTeamListStatus('チームリストを読み込めませんでした。ページを再読み込みしてください。', true);
            }
        }

        /**
         * 読み込んだCSVを解析し、有効なチームがあれば選択画面へ反映する。
         * @param {ProgressEvent<FileReader>} event - FileReader.onload のイベント。
         */
        function handleCsvFileLoaded(event) {
            const csvData = event.target.result;
            try {
                teamListFromCsv = parseTeamCsv(csvData);
                if (teamListFromCsv.length > 0) {
                    initializeTeamSelectionUI();
                    setTeamSelectionMessage("CSVからチームを読み込みました。対戦チームを選択してください。");
                    const csvUploadContainer = document.getElementById('csvUploadContainer');
                    if (csvUploadContainer) csvUploadContainer.classList.add('hidden');
                } else {
                    setTeamSelectionMessage("CSVファイルに有効なチーム情報（番号と名前）がありません。");
                }
            } catch (error) {
                console.error("CSVパースエラー:", error);
                setTeamSelectionMessage("CSVファイルの読み込みに失敗しました。");
            }
        }

        /**
         * FileReaderの読み込み失敗をログと画面へ通知する。
         */
        function handleCsvFileReadError() {
            console.error("ファイル読み込みエラー");
            setTeamSelectionMessage("ファイル読み込み中にエラーが発生しました。");
        }

        /**
         * 選択されたCSVをUTF-8で読み込み、完了または失敗時の処理を登録する。
         */
        function handleCsvLoadButtonClick() {
            if (csvFileInput && csvFileInput.files && csvFileInput.files.length > 0) {
                const file = csvFileInput.files[0];
                const reader = new FileReader();
                reader.onload = handleCsvFileLoaded;
                reader.onerror = handleCsvFileReadError;
                reader.readAsText(file, 'UTF-8');
            } else {
                setTeamSelectionMessage("CSVファイルを選択してください。");
            }
        }

         * @param {Object} match - 編集対象のマッチデータ。
         */
        function restoreCentralBallSelectionForEditing(match) {
            if (centralBallMovedCheckbox) {
                centralBallMovedCheckbox.checked = (match.centralBallState === CENTRAL_BALL_STATES.MOVED);
            }
            if (centralBallNotMovedCheckbox) {
                centralBallNotMovedCheckbox.checked = (match.centralBallState === CENTRAL_BALL_STATES.STILL);
            }
            updateOrangeBallSelectOptions();
        }

        /**
         * 保存済みステータスから手動終了の対象チームと理由を復元する。
         * タイムアップなら理由欄を隠し、それ以外は「チーム表示名 - 理由」を分解して選択値へ戻す。
         * @param {Object} match - 編集対象のマッチデータ。
         */
        function restoreManualEndStatusForEditing(match) {
            if (match.status && match.status !== MATCH_STATUS_TIMEOUT) {
                if (manualEndReasonContainer) manualEndReasonContainer.classList.remove('hidden');
                initializeEndReasonSelects();

                const teamAPrefix = `${confirmedTeamADisplay} - `;
                const teamBPrefix = `${confirmedTeamBDisplay} - `;
                let restoredReason = "";

                if (match.status.startsWith(teamAPrefix)) {
                    if (endedByTeamSelect) endedByTeamSelect.value = confirmedTeamA;
                    restoredReason = match.status.slice(teamAPrefix.length);
                } else if (match.status.startsWith(teamBPrefix)) {
                    if (endedByTeamSelect) endedByTeamSelect.value = confirmedTeamB;
                    restoredReason = match.status.slice(teamBPrefix.length);
                }

                if (endReasonSelect && restoredReason) {
                    endReasonSelect.value = restoredReason;
                }

                // コールド勝利や自動敗北など、理由に付随する入力制御も再適用する
                checkManualEndReasonSelection();
                return;
            }

            if (manualEndReasonContainer) manualEndReasonContainer.classList.add('hidden');
            if (endedByTeamSelect) endedByTeamSelect.value = "";
            if (endReasonSelect) endReasonSelect.value = "";

            match.status = MATCH_STATUS_TIMEOUT;
            match.isColdGame = false;
            match.isPenaltyFixedScore = false;
            match.penaltyLosingTeam = "";
        }

         * @param {Object} match - 編集対象のマッチデータ。

        function restoreScoreInputValuesForEditing(match) {
            if (currentMatchNumber === 2) {
                teamAOrangeBallsSelect.value = match.teamB_Orange ?? "";
                teamAPurpleBallsSelect.value = match.teamB_Purple ?? "";
                teamBOrangeBallsSelect.value = match.teamA_Orange ?? "";
                teamBPurpleBallsSelect.value = match.teamA_Purple ?? "";
                return;
            }

            teamAOrangeBallsSelect.value = match.teamA_Orange ?? "";
            teamAPurpleBallsSelect.value = match.teamA_Purple ?? "";
            teamBOrangeBallsSelect.value = match.teamB_Orange ?? "";

         * @param {Object} match - 編集対象のマッチデータ。

        function restoreColdGameLocksForEditing(match) {

        /**
         * 動的生成した画面要素を取得し、モード選択・入力・画面遷移のイベントを登録する。
         * injectMissingHTML()の後に一度だけ実行する。

        function reassignDynamicPageElements() {
            prelimModeCheckbox = document.getElementById('prelimModeCheckbox');
            finalModeCheckbox = document.getElementById('finalModeCheckbox');
            syncModeCheckboxesFromState();

            if (prelimModeCheckbox) {
                prelimModeCheckbox.addEventListener('change', () => handleModeSelectionChange(MATCH_MODES.PRELIMINARY, prelimModeCheckbox.checked));
            }
            if (finalModeCheckbox) {
                finalModeCheckbox.addEventListener('change', () => handleModeSelectionChange(MATCH_MODES.FINAL, finalModeCheckbox.checked));
            }

            // リザルト入力画面
            currentMatchScoreTitle = document.getElementById('currentMatchScoreTitleInternal');
            scoreTeamAName = document.getElementById('scoreTeamANameInternal');
            teamAOrangeBallsSelect = document.getElementById('teamAOrangeBallsSelectInternal');
            teamAPurpleBallsSelect = document.getElementById('teamAPurpleBallsSelectInternal');
            scoreTeamBName = document.getElementById('scoreTeamBNameInternal');
            teamBOrangeBallsSelect = document.getElementById('teamBOrangeBallsSelectInternal');
            teamBPurpleBallsSelect = document.getElementById('teamBPurpleBallsSelectInternal');
            proceedToNextPhaseButton = document.getElementById('proceedToNextPhaseButtonInternal');
            manualEndReasonContainer = document.getElementById('manualEndReasonContainer');
            endedByTeamSelect = document.getElementById('endedByTeamSelectInternal');
            endReasonSelect = document.getElementById('endReasonSelectInternal');
            centralBallMovedCheckbox = document.getElementById('centralBallMovedCheckbox');
            centralBallNotMovedCheckbox = document.getElementById('centralBallNotMovedCheckbox');
            
            // 各マッチの結果確認画面
            intermediateResultTitle = document.getElementById('intermediateResultTitle');
            intermediateMatchTeams = document.getElementById('intermediateMatchTeams');
            intermediateMatchResultTableBody = document.getElementById('intermediateMatchResultTableBody');
            intermediateMatchWinnerDisplay = document.getElementById('intermediateMatchWinnerDisplay');
            goToNextStepButton = document.getElementById('goToNextStepButton');
            editMatchResultButton = document.getElementById('editMatchResultButton');

            // ボール数は片側の変更から反対側を補完し、中央ボールは排他的に扱う
            if(teamAOrangeBallsSelect) teamAOrangeBallsSelect.addEventListener('change', () => handleScoreSelectChange(teamAOrangeBallsSelect, teamBOrangeBallsSelect, getCurrentOrangeMaxBalls()));
            if(teamBOrangeBallsSelect) teamBOrangeBallsSelect.addEventListener('change', () => handleScoreSelectChange(teamBOrangeBallsSelect, teamAOrangeBallsSelect, getCurrentOrangeMaxBalls()));
            if(teamAPurpleBallsSelect) teamAPurpleBallsSelect.addEventListener('change', () => handleScoreSelectChange(teamAPurpleBallsSelect, teamBPurpleBallsSelect, MAX_PURPLE_BALLS));
            if(teamBPurpleBallsSelect) teamBPurpleBallsSelect.addEventListener('change', () => handleScoreSelectChange(teamBPurpleBallsSelect, teamAPurpleBallsSelect, MAX_PURPLE_BALLS));
            if(centralBallMovedCheckbox) centralBallMovedCheckbox.addEventListener('change', () => handleCentralBallCheckboxChange(CENTRAL_BALL_STATES.MOVED));
            if(centralBallNotMovedCheckbox) centralBallNotMovedCheckbox.addEventListener('change', () => handleCentralBallCheckboxChange(CENTRAL_BALL_STATES.STILL));
            
            if(proceedToNextPhaseButton) {
                proceedToNextPhaseButton.addEventListener('click', handleProceedToNextPhaseClick);
            }
            if(goToNextStepButton) {
                goToNextStepButton.addEventListener('click', handleGoToNextStepClick);
            }
            if(editMatchResultButton) {
                editMatchResultButton.addEventListener('click', handleEditMatchResultClick);
            }
            
             // 対象チームと理由のどちらが変わっても入力制御を再判定する
             if(endedByTeamSelect) endedByTeamSelect.addEventListener('change', checkManualEndReasonSelection);
             if(endReasonSelect) endReasonSelect.addEventListener('change', checkManualEndReasonSelection);

            // 総合結果画面
            resultsTeamsDisplay = document.getElementById('resultsTeamsDisplay');
            resultsHeaderTeamA = document.getElementById('resultsHeaderTeamA');
            resultsHeaderTeamB = document.getElementById('resultsHeaderTeamB');
            resultsTableBody = document.getElementById('resultsTableBody');
            startNewGameButton = document.getElementById('startNewGameButton');
            summaryStatsContainer = document.getElementById('summaryStatsContainer'); 
            overallWinnerDisplay = document.getElementById('overallWinnerDisplay');
            if(startNewGameButton) {
                startNewGameButton.addEventListener('click', handleStartNewGameClick);
            }
        }


        /**
         * ページ読み込み完了後に、保存値の復元、動的画面の生成、イベント登録、初期表示を行う。
         */
        window.onload = () => {
            loadSelectedMatchMode();

            // 1. 空のページへ画面要素を生成する
            injectMissingHTML(); 
            // 2. 生成した要素を取得してイベントを登録する
            reassignDynamicPageElements(); 

            // 3. 初期HTMLに存在する操作ボタンへイベントを登録する
            [startButton, startButtonActive].forEach(btn => btn?.addEventListener('click', startTimer));
            if(pauseButton) pauseButton.addEventListener('click', pauseTimer);
            if(fullResetButton) fullResetButton.addEventListener('click', fullApplicationReset);
            
            if(resetMatchTimerButton) resetMatchTimerButton.addEventListener('click', resetCurrentMatchTimerToAwaitingStart);
            
            // 配置確認後、現在のマッチ番号でタイマー画面を準備する
            if(proceedToMatch1Button) {
                proceedToMatch1Button.addEventListener('click', () => {
                    setupNewMatch(currentMatchNumber);
                });
            }
            
            // 保存した終了区分に合わせてリザルト入力画面を開く
            if(proceedToResultButton) {
                proceedToResultButton.addEventListener('click', () => {
                    setupScorePageUI(matchEndType);
                });
            }

            // モバイル端末でselect操作中の背景スクロールを抑える
            const allSelects = document.querySelectorAll('select');
            allSelects.forEach(select => {
                select.addEventListener('touchmove', stopSelectTouchMovePropagation);
            });

            // 全画面表示の操作と、ブラウザ側の状態変化を同期する
            if (fullscreenButton) {
                fullscreenButton.addEventListener('click', toggleFullscreen);
            }
            document.addEventListener('fullscreenchange', updateFullscreenButtonText);
            
            // 4. 固定CSVを読み込み、チーム選択画面を表示する
            fullApplicationReset(); 
        };
    </script>
</body>
</html>
