<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboSports審判支援ツール</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- 余白や文字装飾に使用するTailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- タイマーの通知音を生成するTone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- アプリ本体 -->
    <div class="container">
        <!-- チーム選択画面でのみ表示する共通ヘッダー -->
        <h1 id="mainTitle" class="text-3xl font-bold mb-2 text-gray-800">RoboSports審判支援ツール</h1>
        <button id="fullResetButton" class="btn btn-danger mb-4">全体リセット</button>

        <!-- 1. 対戦チーム選択：内容は初期化時にJavaScriptで生成 -->
        <div id="universalTeamSelectionPage" class="page"></div>

        <!-- 2. 初期ボール配置 -->
        <div id="ballArrangementPage" class="page hidden">
            <h2 class="match-title-display">ボール配置</h2>
            <div class="arrangement-container">
                <!-- 各配置枠とボールはマッチごとにJavaScriptで生成 -->
                <div id="leftArrangement" class="side-container">
                    <h3>左側</h3>
                </div>
                <div id="rightArrangement" class="side-container">
                    <h3>右側</h3>
                </div>
            </div>
            <button id="proceedToMatch1Button" class="btn btn-primary mt-6">第1マッチに進む</button>
        </div>

        <!-- 3. マッチ進行とタイマー操作 -->
        <div id="matchPlayPage" class="page hidden">
            <div id="currentMatchDisplay" class="match-title-display">第Xマッチ</div>
            <div id="currentMatchTeamsDisplay" class="text-lg font-medium text-gray-700 mb-4">審判左手 vs 審判右手</div>
            <div id="timerDisplay" class="timer-display timer-running">02:00</div>

            <!-- 初回開始前に表示 -->
            <div id="timerControlsPreStart" class="button-group">
                <button id="startButton" class="btn btn-primary">開始</button>
            </div>
            <!-- 開始後と一時停止中に表示 -->
            <div id="timerControlsActive" class="button-group hidden">
                <button id="startButtonActive" class="btn btn-primary" disabled>開始</button>
                <button id="pauseButton" class="btn btn-secondary">一時停止</button>
                <button id="endMatchButton" class="btn btn-danger">試合手動終了</button>
                <button id="resetMatchTimerButton" class="btn btn-warning" disabled>このマッチのタイマーをリセット</button>
            </div>
            
            <!-- タイムアップまたは手動終了後に表示 -->
            <div class="status-handling-container">
                <div id="proceedToResultContainer" class="hidden mt-4">
                    <button id="proceedToResultButton" class="btn btn-primary">リザルト入力へ進む</button>
                </div>
            </div>
            <!-- 待機中・試合中・終了などの現在状態 -->
            <div id="recordDisplayOnTimerPage" class="record-display">記録待機中...</div>
        </div>

        <!-- 4. リザルト入力：内容は初期化時にJavaScriptで生成 -->
        <div id="scoreInputPage" class="page hidden"></div>

        <!-- 5. 各マッチの結果確認 -->
        <div id="intermediateResultPage" class="page hidden">
            <div class="intermediate-result-page-container">
                <h2 id="intermediateResultTitle" class="match-title-display">第Xマッチ 結果</h2>
                <div id="intermediateMatchTeams" class="results-teams-display">チームA vs チームB</div>
                <div id="intermediateMatchStatusDisplay" class="record-display my-3 hidden">リザルト: 未記録</div> 
                <table id="intermediateMatchResultTable" class="results-table">
                    <thead>
                        <tr>
                            <th>チーム</th> 
                            <th>オレンジ</th>
                            <th>紫</th>
                            <th>得点</th>
                        </tr>
                    </thead>
                    <tbody id="intermediateMatchResultTableBody">
                        <!-- チーム別の結果行はJavaScriptで生成 -->
                    </tbody>
                </table>
                <div id="intermediateMatchWinnerDisplay" class="font-bold text-xl my-4">勝者: チームX</div>
                <div class="button-group" style="flex-direction: column; align-items: center;"> 
                    <button id="goToNextStepButton" class="btn btn-primary">次へ進む</button>
                    <button id="editMatchResultButton" class="btn btn-secondary">リザルトを変更</button>
                </div>
            </div>
        </div>

        <!-- 6. 3マッチ分の総合結果 -->
        <div id="resultsPage" class="page hidden">
            <div class="results-page-container">
                <h2 class="match-title-display">試合結果</h2>
                <div id="resultsTeamsDisplay" class="results-teams-display">チームA vs チームB</div>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th rowspan="2">マッチ</th>
                            <th rowspan="2">リザルト</th> 
                            <th colspan="3" id="resultsHeaderTeamA">チームA</th> 
                            <th colspan="3" id="resultsHeaderTeamB">チームB</th> 
                        </tr>
                        <tr>
                            <th>オレンジ</th>
                            <th>紫</th>
                            <th>得点</th>
                            <th>オレンジ</th>
                            <th>紫</th>
                            <th>得点</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <!-- マッチ別の結果行はJavaScriptで生成 -->
                    </tbody>
                </table>
                <!-- 勝利数・違反数・ボール数の総計はJavaScriptで生成 -->
                <div id="summaryStatsContainer"></div>
                <div id="overallWinnerDisplay" class="mt-4 font-bold text-2xl"></div>
                <button id="startNewGameButton" class="btn btn-success mt-4">新しい試合を開始</button>
            </div>
        </div>

        <!-- 試合を手動終了する前の確認ダイアログ -->
        <div id="confirmationModal" class="modal-overlay hidden">
            <div class="modal-content">
                <h3 id="confirmationModalMessage">試合を終了しますか？</h3>
                <div class="modal-buttons">
                    <button id="confirmEndMatchButton" class="btn btn-danger">終了する</button>
                    <button id="cancelEndMatchButton" class="btn btn-secondary">継続する</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- アプリ本体の外側に常時表示する全画面切り替え -->
    <button id="fullscreenButton" class="btn btn-secondary mt-4">全画面表示</button>

    <script>
        // ===================================================================================
        // 画面要素の参照
        // ===================================================================================
        // 静的要素は読み込み時に取得する。動的生成する要素はnullで宣言し、生成後に取得する。

        // 画面切り替えの対象となるページ
        const universalTeamSelectionPage = document.getElementById('universalTeamSelectionPage');
        const ballArrangementPage = document.getElementById('ballArrangementPage'); 
        const matchPlayPage = document.getElementById('matchPlayPage');
        const scoreInputPage = document.getElementById('scoreInputPage');
        const intermediateResultPage = document.getElementById('intermediateResultPage'); 
        const resultsPage = document.getElementById('resultsPage');
        
        // 手動終了の確認ダイアログ
        const confirmationModal = document.getElementById('confirmationModal'); 
        const confirmEndMatchButton = document.getElementById('confirmEndMatchButton');
        const cancelEndMatchButton = document.getElementById('cancelEndMatchButton');
        
        // 動的生成するチーム選択画面
        let csvFileInput = null; 
        let loadCsvButton = null; 
        let teamSelectDropdownsContainer = null; 
        let teamASelect = null; 
        let teamBSelect = null; 
        let selectedTeamsDisplay = null; 
        let confirmTeamsButton = null; 
        let prelimModeCheckbox = null;
        let finalModeCheckbox = null;
        
        // 共通ヘッダーとタイマー表示
        const mainTitle = document.getElementById('mainTitle');
        const fullResetButton = document.getElementById('fullResetButton');
        const currentMatchDisplay = document.getElementById('currentMatchDisplay');
        const currentMatchTeamsDisplay = document.getElementById('currentMatchTeamsDisplay'); 
        const timerDisplay = document.getElementById('timerDisplay');
        
        // タイマーの状態別操作
        const timerControlsPreStart = document.getElementById('timerControlsPreStart');
        const timerControlsActive = document.getElementById('timerControlsActive');
        const startButton = document.getElementById('startButton'); 
        const startButtonActive = document.getElementById('startButtonActive'); 
        const pauseButton = document.getElementById('pauseButton');
        const resetMatchTimerButton = document.getElementById('resetMatchTimerButton');
        const endMatchButton = document.getElementById('endMatchButton'); 
        
        // 動的生成する手動終了・中央ボール入力
        let manualEndReasonContainer = null;
        let endedByTeamSelect = null;
        let endReasonSelect = null;
        let centralBallMovedCheckbox = null;
        let centralBallNotMovedCheckbox = null;
        
        // 試合終了後の案内とリザルト入力への導線
        const proceedToResultContainer = document.getElementById('proceedToResultContainer');
        const proceedToResultButton = document.getElementById('proceedToResultButton');
        const recordDisplayOnTimerPage = document.getElementById('recordDisplayOnTimerPage');

        // 動的生成するボール数入力
        let scoreTeamAName = null; 
        let teamAOrangeBallsSelect = null; 
        let teamAPurpleBallsSelect = null; 
        let scoreTeamBName = null; 
        let teamBOrangeBallsSelect = null; 
        let teamBPurpleBallsSelect = null; 
        let proceedToNextPhaseButton = null;
        let currentMatchScoreTitle = null;
        
        // 初期ボール配置画面
        const leftArrangementDiv = document.getElementById('leftArrangement');
        const rightArrangementDiv = document.getElementById('rightArrangement');
        const proceedToMatch1Button = document.getElementById('proceedToMatch1Button');

        // 各マッチの結果確認画面
        let intermediateResultTitle = document.getElementById('intermediateResultTitle');
        let intermediateMatchTeams = document.getElementById('intermediateMatchTeams');
        let intermediateMatchResultTableBody = document.getElementById('intermediateMatchResultTableBody');
        let intermediateMatchWinnerDisplay = document.getElementById('intermediateMatchWinnerDisplay');
        let goToNextStepButton = document.getElementById('goToNextStepButton');
        let editMatchResultButton = document.getElementById('editMatchResultButton'); 

        // 総合結果画面
        let resultsTeamsDisplay = document.getElementById('resultsTeamsDisplay');
        let resultsHeaderTeamA = document.getElementById('resultsHeaderTeamA'); 
        let resultsHeaderTeamB = document.getElementById('resultsHeaderTeamB'); 
        let resultsTableBody = document.getElementById('resultsTableBody');
        let startNewGameButton = document.getElementById('startNewGameButton');
        let summaryStatsContainer = document.getElementById('summaryStatsContainer'); 
        let overallWinnerDisplay = document.getElementById('overallWinnerDisplay');
        
        const fullscreenButton = document.getElementById('fullscreenButton');
        const pageElements = [
            universalTeamSelectionPage,
            ballArrangementPage,
            matchPlayPage,
            scoreInputPage,
            intermediateResultPage,
            resultsPage
        ];


        // ===================================================================================
        // 定数と進行状態
        // ===================================================================================

        const TOTAL_MATCHES = 3; // 1対戦あたりのマッチ数
        const MIN_MATCH_TIME_SECONDS = 60; // ランダム試合時間の下限（1分）
        const MAX_MATCH_TIME_SECONDS = 120; // ランダム試合時間の上限（2分）
        const MAX_ORANGE_BALLS_STILL = 8; // 中央ボールが動いていない場合の総数
        const MAX_ORANGE_BALLS_MOVED = 9; // 中央ボールが動いた場合の総数
        const MAX_PURPLE_BALLS = 2; // 両チームを合わせた紫ボールの総数
        const MATCH_MODE_STORAGE_KEY = 'robosportsMatchMode'; // モードをブラウザに保存する際のキー
        const USE_FIXED_TEAM_LIST = true; // 一時的にCSVアップロードを無効化し、同梱CSVを使用する
        const FIXED_TEAM_LIST_CSV_PATH = './teamlist_nara.csv'; // 自動読み込みするチームリスト
        // PRELIMINARY/FINALは旧名称の内部キー。値は現在の画面表示と判定方法に対応する。
        const MATCH_MODES = Object.freeze({ PRELIMINARY: "引き分け有り", FINAL: "引き分け無" });
        const MATCH_END_TYPES = Object.freeze({ TIMEOUT: "timeout", MANUAL: "manual", EDIT: "edit" });
        const CENTRAL_BALL_STATES = Object.freeze({ MOVED: "moved", STILL: "still" });
        const MATCH_STATUS_TIMEOUT = "タイムアップ";
        const MATCH_RESULT_DRAW = "draw";
        const END_REASON_COLD_GAME = "コールド勝利";
        const END_REASON_AGREEMENT = "その他両チームの合意";
        // 違反による自動敗北時の固定値。通常スコアと同様に、小さい値を勝者とする。
        const PENALTY_SCORE_FOR_LOSING_TEAM = 9;
        const PENALTY_SCORE_FOR_WINNING_TEAM = -4;

        let currentMatchNumber = 1; // 処理中のマッチ番号（1〜3）
        let timeLeft = MAX_MATCH_TIME_SECONDS; // タイマーの残り秒数（画面初期化時に0へ戻す）
        let timerInterval = null; // カウントダウンを停止するためのsetInterval ID
        let timerRunning = false; // カウントダウン実行中か
        let timerAwaitingStart = true; // 次の開始操作で試合時間を抽選する状態か
        let currentMatchDurationSeconds = 0; // 現在マッチで抽選された開始時の秒数
        let thirtySecondBeepPlayed = false; // 開始30秒後の通知音を再生済みか
        let matchEndType = MATCH_END_TYPES.TIMEOUT; // タイムアップ・手動終了・編集の区分
        
        let confirmedTeamA = ""; // チームAの内部ID（CSVのチーム番号）
        let confirmedTeamB = ""; // チームBの内部ID（CSVのチーム番号）
        let confirmedTeamADisplay = ""; // チームAの画面表示名
        let confirmedTeamBDisplay = ""; // チームBの画面表示名
        let selectedMatchMode = MATCH_MODES.FINAL; // 選択中の引き分けモード。空文字は未選択
        let teamListFromCsv = []; // 読み込んだチーム一覧（{value, text}形式）
        /**
         * マッチごとの入力内容と判定結果。配列位置は「マッチ番号 - 1」。
         *
         * 主なプロパティ:
         * - teamA_Orange / teamA_Purple / teamB_Orange / teamB_Purple: チーム別ボール数
         * - status: 「タイムアップ」または「チーム表示名 - 終了理由」
         * - winner: チームAのID、チームBのID、または "draw"
         * - centralBallState: "moved"、"still"、または未選択を表す空文字
         * - isColdGame: コールド勝利用の入力制御を適用するか
         * - isPenaltyFixedScore: 違反による固定スコアを適用するか
         * - penaltyLosingTeam: 違反時は敗者ID、コールド勝利時は勝者IDを保持する
         */
        let matchesData = [];

        // 選択したチームを自動敗北とし、固定スコアと違反回数を適用する終了理由
        const PENALTY_FIXED_SCORE_REASONS = [ 
            "レッドゾーン接触(6.27)",
            "故意のロボット接触(6.28)",
            "相手フィールド接触(6.29)",
            "分離パーツ接触(6.23)",
            "試合開始後10秒ロボット不動(6.20)",
            "両ロボット除去(6.21)", 
            "両ロボット脱走(6.32.6)", 
            "ロボットのサイズ超過(6.32.3)",
            "フィールド・ボール破壊(6.32.7・6.32.8)",
            "選手のロボット接触(6.33)",
            "選手のフィールド接触(6.32.5)"
        ];
        // ===================================================================================
        // 通知音
        // ===================================================================================
        let synth = null; // Tone.jsのシンセサイザー。ユーザー操作後に生成する
        const BEEP_VOLUME = 0; // Tone.jsの既定音量

        /**
         * Tone.jsを再生可能にし、通知音用シンセサイザーを一度だけ生成する。
         * ブラウザの自動再生制限を避けるため、最初のユーザー操作後に呼び出す。
         */
        function initializeAudio() {
            if (!synth && typeof Tone !== 'undefined') {
                if (Tone.context.state !== 'running') {
                    Tone.start().then(() => {
                        console.log("AudioContext started by Tone.js");
                        synth = new Tone.Synth({ volume: BEEP_VOLUME }).toDestination();
                    }).catch(e => {
                        console.error("Error starting Tone.js AudioContext:", e);
                    });
                    return;
                }
                synth = new Tone.Synth({ volume: BEEP_VOLUME }).toDestination();
            }
        }
        // 最初のクリックをブラウザの音声再生許可に利用する
        document.body.addEventListener('click', initializeAudio, { once: true });

        /**
         * 短いビープ音（例: 一時停止）を再生する。
         */
        function playShortBeep() {
            initializeAudio(); // 直接呼ばれた場合にも初期化を保証する
            if (synth && Tone.context.state === 'running') {
                try {
                    // 一時停止・リセット音
                    synth.triggerAttackRelease("G5", "0.1", Tone.now()); 
                } catch (e) {
                    console.error("Error playing short beep:", e);
                }
            }
        }

        /**
         * 試合開始30秒後の通知音を再生する。
         */
        function playThirtySecondBeep() {
            initializeAudio();
            if (synth && Tone.context.state === 'running') {
                try {
                    // 開始30秒経過の通知音
                    synth.triggerAttackRelease("C5", "1", Tone.now());
                } catch (e) {
                    console.error("Error playing 30-second beep:", e);
                }
            }
        }

        /**
         * 長いビープ音（開始/終了）を再生する。
         */
        function playLongBeep() {
            initializeAudio(); // 直接呼ばれた場合にも初期化を保証する
            if (synth && Tone.context.state === 'running') {
                 try {
                    // 開始・終了音
                    synth.triggerAttackRelease("E6", "1.5", Tone.now()); 
                } catch (e) {
                    console.error("Error playing long beep:", e);
                }
            }
        }


        // ===================================================================================
        // ページ表示と共通UI
        // ===================================================================================

        /**
         * アプリタイトルと全体リセットボタンの表示/非表示を切り替える。
         * 先頭のチーム選択ページだけで表示し、進行中の画面では審判操作に集中できるよう隠す。
         * @param {boolean} isVisible - trueならタイトルと全体リセットを表示する。
         */
        function setHomeChromeVisibility(isVisible) {
            if (!fullResetButton || !mainTitle) return;
            fullResetButton.classList.toggle('hidden', !isVisible);
            mainTitle.classList.toggle('hidden', !isVisible);
        }
        
        /**
         * 指定ページのみ表示し、他ページは非表示にする。
         * @param {HTMLElement} pageElement 表示したいページのコンテナ要素。
         */
        function showPage(pageElement) {
            // 先に全ページを隠してから、指定ページだけを表示する
            pageElements.forEach(p => {
                if (p) p.classList.add('hidden');
            });
            if (pageElement) {
                pageElement.classList.remove('hidden');
            }
            
            // 共通ヘッダーはチーム選択画面だけに表示する
            setHomeChromeVisibility(pageElement === universalTeamSelectionPage);
        }

        /**
         * select要素の既存項目を消し、配列または0〜maxの数値から選択肢を作る。
         * @param {HTMLSelectElement} selectElement - 対象のselect要素。
         * @param {number} max - 数字の選択肢を生成する場合の最大値。
         * @param {boolean} includeDefault - 「選択」というデフォルトの選択肢を含めるかどうか。
         * @param {Array|null} optionsArray - 文字列または{value, text}オブジェクトの配列で選択肢を指定。
         */
        function populateSelectWithOptions(selectElement, max, includeDefault = true, optionsArray = null) {
            if (!selectElement) return; 
            selectElement.innerHTML = '';
            if (includeDefault) {
                const defaultOption = new Option("選択", ""); // 空文字を値に持つ未選択項目
                selectElement.add(defaultOption);
            }
            if (optionsArray) {
                optionsArray.forEach(opt => {
                    if (typeof opt === 'object' && opt.hasOwnProperty('value') && opt.hasOwnProperty('text')) { 
                        selectElement.add(new Option(opt.text, opt.value));
                    } else if (typeof opt === 'string') { 
                        selectElement.add(new Option(opt, opt));
                    }
                });
            } else {
                for (let i = 0; i <= max; i++) {
                    selectElement.add(new Option(i, i));
                }
            }
        }
        
        /**
         * 4つのボール数入力を未選択状態で生成する。
         */
        function initializeScoreSelects() {
            populateSelectWithOptions(teamAOrangeBallsSelect, MAX_ORANGE_BALLS_STILL, true);
            populateSelectWithOptions(teamBOrangeBallsSelect, MAX_ORANGE_BALLS_STILL, true);
            populateSelectWithOptions(teamAPurpleBallsSelect, MAX_PURPLE_BALLS, true);
            populateSelectWithOptions(teamBPurpleBallsSelect, MAX_PURPLE_BALLS, true);
        }

        /**
         * 中央ボールの選択状態を返す。
         * 2つのチェックボックスは排他的に扱い、未選択時はnullを返す。
         * @returns {"moved"|"still"|null}
         */
        function getSelectedCentralBallState() {
            if (centralBallMovedCheckbox?.checked) return CENTRAL_BALL_STATES.MOVED;
            if (centralBallNotMovedCheckbox?.checked) return CENTRAL_BALL_STATES.STILL;
            return null;
        }

        /**
         * 中央ボールが動いた場合は9、それ以外は8をオレンジボールの総数として返す。
         * @returns {number}
         */
        function getCurrentOrangeMaxBalls() {
            return getSelectedCentralBallState() === CENTRAL_BALL_STATES.MOVED
                ? MAX_ORANGE_BALLS_MOVED
                : MAX_ORANGE_BALLS_STILL;
        }

        /**
         * 中央ボール状態に合わせて、オレンジボール入力の範囲とラベルを更新する。
         * 選択済みの値は新しい範囲内に限って保持する。
         */
        function updateOrangeBallSelectOptions() {
            const maxOrangeBalls = getCurrentOrangeMaxBalls();
            const prevA = teamAOrangeBallsSelect?.value ?? "";
            const prevB = teamBOrangeBallsSelect?.value ?? "";

            populateSelectWithOptions(teamAOrangeBallsSelect, maxOrangeBalls, true);
            populateSelectWithOptions(teamBOrangeBallsSelect, maxOrangeBalls, true);

            if (prevA !== "" && Number(prevA) <= maxOrangeBalls && teamAOrangeBallsSelect) {
                teamAOrangeBallsSelect.value = prevA;
            }
            if (prevB !== "" && Number(prevB) <= maxOrangeBalls && teamBOrangeBallsSelect) {
                teamBOrangeBallsSelect.value = prevB;
            }

            const labelA = document.querySelector('label[for="teamAOrangeBallsSelectInternal"]');
            const labelB = document.querySelector('label[for="teamBOrangeBallsSelectInternal"]');
            const rangeText = `(0-${maxOrangeBalls})`;
            if (labelA) labelA.textContent = `オレンジボール ${rangeText}:`;
            if (labelB) labelB.textContent = `オレンジボール ${rangeText}:`;
        }

        /**
         * スコア入力の前提項目が揃っているかを返す。
         * 中央ボールは常に必須で、手動終了時は対象チームと終了理由も必須。
         * @returns {boolean}
         */
        function canOperateScoreInputs() {
            if (!getSelectedCentralBallState()) return false;
            if (!manualEndReasonContainer?.classList.contains('hidden')) {
                return !!(endedByTeamSelect?.value && endReasonSelect?.value);
            }
            return true;
        }

        /**
         * コールド勝利時のオレンジボール数を、勝者0・敗者最大数に固定する。
         * 第2マッチでは画面上の左右が入れ替わるため、チームIDから対象欄を特定する。
         */
        function applyColdGameOrangeConstraintsIfNeeded() {
            const matchData = getCurrentMatchData();
            if (!matchData.isColdGame) return;

            const { win: uiWinningOrangeSelect, lose: uiLosingOrangeSelect } = getColdGameOrangeSelects(matchData.penaltyLosingTeam);
            const maxOrangeBalls = getCurrentOrangeMaxBalls();

            if (uiWinningOrangeSelect) {
                uiWinningOrangeSelect.value = "0";
                uiWinningOrangeSelect.disabled = true;
            }
            if (uiLosingOrangeSelect) {
                uiLosingOrangeSelect.value = String(maxOrangeBalls);
                uiLosingOrangeSelect.disabled = true;
                // 通常入力と同じ補完処理を通し、両側の値と確定可否を同期する
                handleScoreSelectChange(uiLosingOrangeSelect, uiWinningOrangeSelect, maxOrangeBalls);
            }
        }

        /**
         * 前提項目の選択状態に応じて、ボール数入力と確定ボタンを更新する。
         */
        function updateScoreInputsLockState() {
            const scoreSelects = getScoreSelects();
            const canOperate = canOperateScoreInputs();

            scoreSelects.forEach(sel => {
                sel.disabled = !canOperate;
            });

            if (!canOperate) {
                if (proceedToNextPhaseButton) proceedToNextPhaseButton.disabled = true;
                return;
            }

            applyColdGameOrangeConstraintsIfNeeded();
            checkIfScoresAreComplete();
        }

        /**
         * 中央ボールの2択を排他的に更新し、現在マッチへ保存する。
         * @param {"moved"|"still"} changedType - 操作されたチェックボックスの種類。
         */
        function handleCentralBallCheckboxChange(changedType) {
            if (changedType === CENTRAL_BALL_STATES.MOVED && centralBallMovedCheckbox?.checked && centralBallNotMovedCheckbox) {
                centralBallNotMovedCheckbox.checked = false;
            }
            if (changedType === CENTRAL_BALL_STATES.STILL && centralBallNotMovedCheckbox?.checked && centralBallMovedCheckbox) {
                centralBallMovedCheckbox.checked = false;
            }

            const matchData = getCurrentMatchData();
            matchData.centralBallState = getSelectedCentralBallState() || "";

            updateOrangeBallSelectOptions();
            updateScoreInputsLockState();
        }

        /**
         * コールド勝利では中央ボールを「動いた」に固定する。
         * それ以外の終了理由では、審判が通常どおり選択できる状態に戻す。
         * @param {string} reasonValue - 選択中の終了理由。
         */
        function updateCentralBallConstraintsForEndReason(reasonValue) {
            const isCold = reasonValue === END_REASON_COLD_GAME;

            if (centralBallMovedCheckbox) {
                if (isCold) centralBallMovedCheckbox.checked = true;
                centralBallMovedCheckbox.disabled = isCold;
            }
            if (centralBallNotMovedCheckbox) {
                if (isCold) centralBallNotMovedCheckbox.checked = false;
                centralBallNotMovedCheckbox.disabled = isCold;
            }

            if (isCold) {
                getCurrentMatchData().centralBallState = CENTRAL_BALL_STATES.MOVED;
                updateOrangeBallSelectOptions();
            }
        }
        
        /**
         * 手動終了理由の選択肢を通常終了と自動敗北に分けて生成する。
         */
        function initializeEndReasonSelects() {
            const endReasons = [];

            // 固定スコアや違反回数を適用しない終了理由
            const nonPenaltyReasons = [
                "コールド勝利(選択チームの勝利)",
                "その他両チームの合意(申し出たチームを選択・裁定に無関係)",
                "事故のロボット接触(6.28)", 
                "全ロボット行動不能(6.32.9)", 
                "5個以上のボールを5秒保持(6.30)"
            ];
            
            nonPenaltyReasons.forEach(reasonText => {
                let value = reasonText;
                // 補足を含む表示文から、判定に使う共通値だけを取り出す
                if(reasonText.startsWith(END_REASON_COLD_GAME)) {
                    value = END_REASON_COLD_GAME;
                } else if(reasonText.startsWith(END_REASON_AGREEMENT)){
                    value = END_REASON_AGREEMENT;
                }
                 endReasons.push({ text: reasonText, value: value });
            });

            // 選択したチームを自動敗北とする終了理由
            PENALTY_FIXED_SCORE_REASONS.forEach(reason => {
                endReasons.push({
                    text: `[違反・自動敗北]${reason}`,
                    value: reason
                });
            });

            populateSelectWithOptions(endReasonSelect, 0, true, endReasons);
            if (endedByTeamSelect) endedByTeamSelect.value = "";
            if (endReasonSelect) endReasonSelect.value = "";
        }


        // ===================================================================================
        // 初期化とリセット
        // ===================================================================================

        /**
         * 読み込み済みのチーム一覧で選択欄を作り直し、入力イベントを登録する。
         */
        function initializeTeamSelectionUI() { 
            // injectMissingHTML()で生成した要素を取得する
            teamASelect = document.getElementById('teamASelectInternal');
            teamBSelect = document.getElementById('teamBSelectInternal');
            selectedTeamsDisplay = document.getElementById('selectedTeamsDisplayInternal');
            confirmTeamsButton = document.getElementById('confirmTeamsButtonInternal');

            if (!teamASelect || !teamBSelect || !selectedTeamsDisplay || !confirmTeamsButton) {
                console.error("Team selection dropdown elements not found.");
                return;
            }
            
            // 両方の選択欄へ同じチーム一覧を設定する
            populateSelectWithOptions(teamASelect, 0, true, teamListFromCsv); 
            populateSelectWithOptions(teamBSelect, 0, true, teamListFromCsv);

            // 未選択・再選択可能な状態へ戻す
            selectedTeamsDisplay.textContent = "チームを選択してください";
            confirmTeamsButton.disabled = true;
            teamASelect.disabled = false;
            teamBSelect.disabled = false;
            if(teamSelectDropdownsContainer) teamSelectDropdownsContainer.classList.remove('hidden');

             // 組み合わせの検証と確定処理を登録する
             teamASelect.onchange = handleTeamSelectionChange;
             teamBSelect.onchange = handleTeamSelectionChange;
             confirmTeamsButton.onclick = () => {
                if (!isMatchModeSelected()) {
                    setTeamSelectionMessage("モード（引き分け無/引き分け有り）を選択してください");
                    return;
                }

                const teamAOption = teamASelect.options[teamASelect.selectedIndex];
                const teamBOption = teamBSelect.options[teamBSelect.selectedIndex];

                // 内部IDと画面表示名を分けて保持する
                confirmedTeamA = teamAOption.value; 
                confirmedTeamADisplay = teamAOption.text; 
                confirmedTeamB = teamBOption.value;
                confirmedTeamBDisplay = teamBOption.text;

                // 進行中に対戦チームが変わらないよう入力をロックする
                teamASelect.disabled = true; 
                teamBSelect.disabled = true;
                confirmTeamsButton.disabled = true; 
                
                // 総合結果表のチーム名を確定時点で設定する
                if(resultsHeaderTeamA) resultsHeaderTeamA.textContent = confirmedTeamADisplay;
                if(resultsHeaderTeamB) resultsHeaderTeamB.textContent = confirmedTeamBDisplay;

                // 第1マッチの初期ボール配置を生成する
                displayBallArrangement();
            };
        }
        
        /**
         * タイマー、操作ボタン、入力欄をマッチ開始前の状態へ戻す。
         * 新しいマッチの準備とアプリ全体のリセットから共通で呼び出す。
         */
        function resetMatchSpecificUIData() {
            timeLeft = 0;
            timerRunning = false;
            timerAwaitingStart = true;
            currentMatchDurationSeconds = 0;
            thirtySecondBeepPlayed = false;

            if (timerInterval) clearInterval(timerInterval); // 前マッチのカウントダウンを確実に停止する
            if(timerDisplay) {
                timerDisplay.textContent = formatTime(timeLeft);
                timerDisplay.classList.remove('timer-paused', 'timer-ended');
                timerDisplay.classList.add('timer-running'); 
            }
            
            // 初回の「開始」だけを操作できる状態にする
            if(timerControlsPreStart) timerControlsPreStart.classList.remove('hidden');
            if(timerControlsActive) timerControlsActive.classList.add('hidden');
            if(startButton) startButton.disabled = false; 
            if(startButtonActive) startButtonActive.disabled = true; 
            if(pauseButton) pauseButton.disabled = true;
            if(endMatchButton) endMatchButton.disabled = false; 
            if(resetMatchTimerButton) resetMatchTimerButton.disabled = true; 
            
            // 終了後の導線と手動終了理由を初期化する
            if(proceedToResultContainer) proceedToResultContainer.classList.add('hidden'); 
            if(endedByTeamSelect) {
                endedByTeamSelect.disabled = false;
                endReasonSelect.disabled = false;
                initializeEndReasonSelects();
            } 

            // タイマー下の状態表示を待機中へ戻す
            if(recordDisplayOnTimerPage) {
                recordDisplayOnTimerPage.textContent = "記録待機中...";
                recordDisplayOnTimerPage.classList.remove('recorded');
            }

            // 中央ボールなどの前提入力が済むまでボール数を操作不可にする
            getScoreSelects().forEach(sel => {
                sel.value = "";
                sel.disabled = true;
            });
            if(proceedToNextPhaseButton) proceedToNextPhaseButton.disabled = true;
        }

        /**
         * 指定したマッチ番号を画面へ反映し、タイマー開始前の状態を表示する。
         * @param {number} matchNum - 開始するマッチ番号（1〜3）。
         */
        function setupNewMatch(matchNum) {
            currentMatchNumber = matchNum;
            // タイマー画面とリザルト入力画面の見出しを同期する
            if(currentMatchDisplay) currentMatchDisplay.textContent = `第${currentMatchNumber}マッチ`;
            if(currentMatchTeamsDisplay) currentMatchTeamsDisplay.textContent = `${confirmedTeamADisplay} vs ${confirmedTeamBDisplay}`; 
            if(currentMatchScoreTitle) currentMatchScoreTitle.textContent = `第${currentMatchNumber}マッチ リザルト入力`; 
            
            resetMatchSpecificUIData();
            showPage(matchPlayPage);
        }

        /**
         * 対戦データを破棄し、固定チームリストの選択画面へ戻す。
         * CSVアップロードを再開した場合は、従来どおりファイル選択画面へ戻す。
         */
        function fullApplicationReset() { 
            // 対戦チームと全マッチの結果を破棄する
            currentMatchNumber = 1;
            matchesData = [];
            confirmedTeamA = "";
            confirmedTeamB = "";
            confirmedTeamADisplay = "";
            confirmedTeamBDisplay = "";

            const csvUploadContainer = document.getElementById('csvUploadContainer'); 
            resetMatchSpecificUIData(); 
            initializeScoreSelects(); 
            showPage(universalTeamSelectionPage);

            if (USE_FIXED_TEAM_LIST) {
                // 固定CSVは初回だけ取得し、以降のリセットでは読み込み済み一覧を再利用する
                if (csvUploadContainer) csvUploadContainer.classList.add('hidden');
                if (teamListFromCsv.length > 0) {
                    initializeTeamSelectionUI();
                    updateFixedTeamListStatus(`${teamListFromCsv.length}チームから選択できます。`, false);
                } else {
                    if(teamSelectDropdownsContainer) teamSelectDropdownsContainer.classList.add('hidden');
                    loadFixedTeamList();
                }
                return;
            }

            // 固定CSV使用を解除したときは、従来のアップロード画面へ戻す
            teamListFromCsv = [];
            if(csvFileInput) csvFileInput.value = "";
            if(csvUploadContainer) csvUploadContainer.classList.remove('hidden');
            if(teamSelectDropdownsContainer) teamSelectDropdownsContainer.classList.add('hidden');
        }

        /**
         * CSVから読み込んだチーム一覧を残し、対戦データだけを初期化する。
         */
        function resetForNewGameWithSameCsv() { 
            currentMatchNumber = 1;
            matchesData = [];
            
            resetMatchSpecificUIData();
            initializeScoreSelects(); 

            // CSV読み込みを省略し、対戦チームの再選択から始める
            const csvUploadContainer = document.getElementById('csvUploadContainer');
            if (universalTeamSelectionPage && csvUploadContainer && teamSelectDropdownsContainer) {
                csvUploadContainer.classList.add('hidden');
                initializeTeamSelectionUI();
                showPage(universalTeamSelectionPage);
            } else {
                console.error("Cannot reset to team selection: universal page or containers not found.");
                fullApplicationReset(); // 必要な画面要素がなければ復旧可能な初期状態へ戻す
            }
        }


        // ===================================================================================
        // 対戦チーム選択
        // ===================================================================================

        /**
         * モードと両チームの選択内容を検証し、確定ボタンの状態を更新する。
         */
        function handleTeamSelectionChange() {
            if (!teamASelect || !teamBSelect || !selectedTeamsDisplay || !confirmTeamsButton) return;
            const teamAVal = teamASelect.value; 
            const teamBVal = teamBSelect.value;
            const teamAText = teamASelect.options[teamASelect.selectedIndex].text;
            const teamBText = teamBSelect.options[teamBSelect.selectedIndex].text;

            if (!isMatchModeSelected()) {
                selectedTeamsDisplay.textContent = "モード（引き分け無/引き分け有り）を選択してください";
                selectedTeamsDisplay.style.color = "orange";
                confirmTeamsButton.disabled = true;
                return;
            }

            if (teamAVal && teamBVal) {
                if (teamAVal === teamBVal) {
                    selectedTeamsDisplay.textContent = "異なるチームを選択してください";
                    selectedTeamsDisplay.style.color = "red";
                    confirmTeamsButton.disabled = true;
                } else {
                    selectedTeamsDisplay.textContent = `${teamAText} vs ${teamBText}`;
                    selectedTeamsDisplay.style.color = "#1e40af";
                    confirmTeamsButton.disabled = false;
                }
            } else {
                selectedTeamsDisplay.textContent = "両方のチームを選択してください";
                selectedTeamsDisplay.style.color = "orange";
                confirmTeamsButton.disabled = true;
            }
        }

        // ===================================================================================
        // 初期ボール配置
        // ===================================================================================

        /**
         * 左側の4行をランダム生成し、その点対称となる右側の配置を表示する。
         * 各行にはオレンジを1個置き、ランダムに選んだ1行だけ反対側へ紫を置く。
         */
        function displayBallArrangement() {
            if (!leftArrangementDiv || !rightArrangementDiv) return;

            // 前マッチの配置を見出しごと消して作り直す
            leftArrangementDiv.innerHTML = '<h3>左側</h3>';
            rightArrangementDiv.innerHTML = '<h3>右側</h3>';

            let leftArrangementData = [];
            // 紫ボールを追加する行を4行から1つ選ぶ
            const purplePairIndex = Math.floor(Math.random() * 4);

            // 各行の左右どちらへオレンジを置くかを抽選する
            for (let i = 0; i < 4; i++) {
                const orangeSide = Math.floor(Math.random() * 2); // 0は左、1は右
                let purpleSide = -1; // -1はこの行に紫ボールを置かない
                if (i === purplePairIndex) {
                    purpleSide = 1 - orangeSide;
                }
                leftArrangementData.push({ orange: orangeSide, purple: purpleSide });
            }

            // 抽選結果から左側の配置枠を描画する
            leftArrangementData.forEach(pairData => {
                const pairDiv = document.createElement('div');
                pairDiv.className = 'circle-pair';
                for (let i = 0; i < 2; i++) {
                    const outerCircle = document.createElement('div');
                    outerCircle.className = 'outer-circle';
                    if (pairData.orange === i) {
                        const innerCircle = document.createElement('div');
                        innerCircle.className = 'inner-circle orange';
                        outerCircle.appendChild(innerCircle);
                    }
                    if (pairData.purple === i) {
                        const innerCircle = document.createElement('div');
                        innerCircle.className = 'inner-circle purple';
                        outerCircle.appendChild(innerCircle);
                    }
                    pairDiv.appendChild(outerCircle);
                }
                leftArrangementDiv.appendChild(pairDiv);
            });

            // 行順と各行の左右を反転し、右側を点対称にする
            const rightArrangementData = [...leftArrangementData].reverse();
            rightArrangementData.forEach(pairData => {
                const pairDiv = document.createElement('div');
                pairDiv.className = 'circle-pair';
                for (let i = 0; i < 2; i++) {
                    const outerCircle = document.createElement('div');
                    outerCircle.className = 'outer-circle';
                    // 0と1を入れ替えて左右位置を反転する
                    if (1 - pairData.orange === i) {
                        const innerCircle = document.createElement('div');
                        innerCircle.className = 'inner-circle orange';
                        outerCircle.appendChild(innerCircle);
                    }
                    if (pairData.purple !== -1 && (1 - pairData.purple) === i) {
                        const innerCircle = document.createElement('div');
                        innerCircle.className = 'inner-circle purple';
                        outerCircle.appendChild(innerCircle);
                    }
                    pairDiv.appendChild(outerCircle);
                }
                rightArrangementDiv.appendChild(pairDiv);
            });

            // 次に開始するマッチ番号をボタンへ表示する
            if (proceedToMatch1Button) {
                proceedToMatch1Button.textContent = `第${currentMatchNumber}マッチに進む`;
            }

            showPage(ballArrangementPage);
        }

        /**
         * 現在マッチのデータを返す。未作成なら空の保存領域を先に用意する。
         * @returns {Object} matchesData内に保持される現在マッチのオブジェクト。
         */
        function getCurrentMatchData() {
            const index = currentMatchNumber - 1;
            if (!matchesData[index]) {
                matchesData[index] = {};
            }
            return matchesData[index];
        }

        /**
         * 生成済みのボール数入力欄だけを配列で返す。
         * @returns {HTMLSelectElement[]}
         */
        function getScoreSelects() {
            return [
                teamAOrangeBallsSelect,
                teamAPurpleBallsSelect,
                teamBOrangeBallsSelect,
                teamBPurpleBallsSelect
            ].filter(Boolean);
        }

        /**
         * 1マッチの時間を、下限と上限を含む範囲から1秒単位で抽選する。
         * @returns {number} 60〜120の整数。
         */
        function getRandomMatchDurationSeconds() {
            return Math.floor(Math.random() * (MAX_MATCH_TIME_SECONDS - MIN_MATCH_TIME_SECONDS + 1)) + MIN_MATCH_TIME_SECONDS;
        }

        /**
         * チーム選択画面のメッセージ要素を、生成済みIDまたは保持中の参照から取得する。
         * @returns {HTMLElement|null}
         */
        function getTeamSelectionMessageElement() {
            return document.getElementById('selectedTeamsDisplayInternal') || selectedTeamsDisplay;
        }

        /**
         * 保存済みの引き分けモードを復元する。
         * 保存値が空・不正、またはlocalStorageを利用できない場合は「引き分け無」を選ぶ。
         */
        function loadSelectedMatchMode() {
            try {
                const saved = localStorage.getItem(MATCH_MODE_STORAGE_KEY);
                if (saved === MATCH_MODES.PRELIMINARY || saved === MATCH_MODES.FINAL || saved === "") {
                    selectedMatchMode = saved || MATCH_MODES.FINAL;
                    return;
                }
            } catch (e) {
                console.error("モード選択の読み込みに失敗:", e);
            }
            selectedMatchMode = MATCH_MODES.FINAL;
        }

        /**
         * 現在の引き分けモードをlocalStorageへ保存する。
         * 保存できない環境でも、現在のページ内では選択状態を維持する。
         */
        function persistSelectedMatchMode() {
            try {
                localStorage.setItem(MATCH_MODE_STORAGE_KEY, selectedMatchMode);
            } catch (e) {
                console.error("モード選択の保存に失敗:", e);
            }
        }

        /**
         * 選択値が定義済みの引き分けモードかを返す。
         * @returns {boolean}
         */
        function isMatchModeSelected() {
            return selectedMatchMode === MATCH_MODES.PRELIMINARY || selectedMatchMode === MATCH_MODES.FINAL;
        }

        /**
         * selectedMatchModeと2つのチェックボックスの選択状態を同期する。
         */
        function syncModeCheckboxesFromState() {
            if (prelimModeCheckbox) prelimModeCheckbox.checked = selectedMatchMode === MATCH_MODES.PRELIMINARY;
            if (finalModeCheckbox) finalModeCheckbox.checked = selectedMatchMode === MATCH_MODES.FINAL;
        }

        /**
         * 引き分けモードの2択を排他的に更新し、保存とチーム選択の再検証を行う。
         * 選択中の項目を外した場合は未選択状態にする。
         * @param {string} mode - 選択対象のモード。
         * @param {boolean} isChecked - チェックされたかどうか。
         */
        function handleModeSelectionChange(mode, isChecked) {
            if (isChecked) {
                selectedMatchMode = mode;
            } else if (selectedMatchMode === mode) {
                selectedMatchMode = "";
            }

            syncModeCheckboxesFromState();
            persistSelectedMatchMode();
            handleTeamSelectionChange();
        }

        /**
         * チーム選択画面が生成済みの場合だけ、案内メッセージを更新する。
         * @param {string} message - 表示したいメッセージ。
         */
        function setTeamSelectionMessage(message) {
            const displayEl = getTeamSelectionMessageElement();
            if (displayEl) displayEl.textContent = message;
        }

        /**
         * コールド勝利時に固定する勝者側・敗者側のオレンジ入力欄を返す。
         * 第2マッチのコートチェンジを考慮し、勝利チームIDを画面上の左右へ対応付ける。
         * @param {string} winningTeamValue - コールド勝利を選択したチームID。
         * @returns {{win: HTMLSelectElement|null, lose: HTMLSelectElement|null}}
         */
        function getColdGameOrangeSelects(winningTeamValue) {
            if (currentMatchNumber === 2) {
                return winningTeamValue === confirmedTeamB
                    ? { win: teamAOrangeBallsSelect, lose: teamBOrangeBallsSelect }
                    : { win: teamBOrangeBallsSelect, lose: teamAOrangeBallsSelect };
            }
            return winningTeamValue === confirmedTeamA
                ? { win: teamAOrangeBallsSelect, lose: teamBOrangeBallsSelect }
                : { win: teamBOrangeBallsSelect, lose: teamAOrangeBallsSelect };
        }

        // ===================================================================================
        // マッチタイマー
        // ===================================================================================
        
        /**
         * 秒数をゼロ埋めした「分:秒」形式へ変換する。
         * @param {number} seconds - 表示する秒数。
         * @returns {string} 例: "02:00"。
         */
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            // 分と秒を常に2桁で表示する
            return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        /**
         * 待機中なら試合時間を抽選して開始し、一時停止中なら残り時間から再開する。
         */
        function startTimer() {
            if (timerRunning || (timeLeft === 0 && !timerAwaitingStart)) return; // 二重開始と終了後の再開を防ぐ
            // 新規開始または明示的なタイマーリセット後に限り、時間を再抽選する
            if (timerAwaitingStart) {
                timeLeft = getRandomMatchDurationSeconds();
                currentMatchDurationSeconds = timeLeft;
                thirtySecondBeepPlayed = false;
                if (timerDisplay) {
                    timerDisplay.textContent = formatTime(timeLeft);
                }
                timerAwaitingStart = false;
            }
            playLongBeep();
            timerRunning = true;
            
            // 一時停止と手動終了を操作できる実行中表示へ切り替える
            if(timerControlsPreStart) timerControlsPreStart.classList.add('hidden');
            if(timerControlsActive) timerControlsActive.classList.remove('hidden');
            if(startButtonActive) startButtonActive.disabled = true; 
            if(pauseButton) pauseButton.disabled = false;
            if(endMatchButton) endMatchButton.disabled = false; 
            if(resetMatchTimerButton) resetMatchTimerButton.disabled = true; 
            if(timerDisplay) {
                timerDisplay.classList.remove('timer-paused', 'timer-ended');
                timerDisplay.classList.add('timer-running');
            }

            // 終了後の導線を隠し、状態表示を試合中へ変える
            if(recordDisplayOnTimerPage) {
                recordDisplayOnTimerPage.textContent = "試合中...";
                recordDisplayOnTimerPage.classList.remove('recorded');
            }
             if(proceedToResultContainer) proceedToResultContainer.classList.add('hidden'); 

            // 1秒ごとに残り時間と通知状態を更新する
            timerInterval = setInterval(() => {
                timeLeft--;
                if(timerDisplay) timerDisplay.textContent = formatTime(timeLeft);

                // 一時停止を挟んでも、累計30秒経過時に一度だけ鳴らす
                const elapsedSeconds = currentMatchDurationSeconds - timeLeft;
                if (!thirtySecondBeepPlayed && elapsedSeconds >= 30) {
                    playThirtySecondBeep();
                    thirtySecondBeepPlayed = true;
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    timeLeft = 0;
                    if(timerDisplay) {
                        timerDisplay.textContent = formatTime(timeLeft);
                        timerDisplay.classList.remove('timer-running', 'timer-paused');
                        timerDisplay.classList.add('timer-ended');
                    }
                    playLongBeep();
                    handleMatchEnd(true);
                }
            }, 1000);
        }

        /**
         * 実行中のカウントダウンを止め、再開またはタイマーリセットを選べる状態にする。
         */
        function pauseTimer() {
            if (!timerRunning) return;
            playShortBeep();
            clearInterval(timerInterval);
            timerRunning = false;

            // 再開とタイマーリセットを有効にする
            if(startButtonActive) startButtonActive.disabled = false;
            if(pauseButton) pauseButton.disabled = true;
            if(resetMatchTimerButton) resetMatchTimerButton.disabled = false;
            if(timerDisplay) {
                timerDisplay.classList.remove('timer-running', 'timer-ended');
                timerDisplay.classList.add('timer-paused');
            }
            if(recordDisplayOnTimerPage) recordDisplayOnTimerPage.textContent = "一時停止中";
        }
        
        // 手動終了は誤操作を防ぐため、確認ダイアログを挟む
        if(endMatchButton) endMatchButton.addEventListener('click', () => { 
            if(confirmationModal) confirmationModal.classList.remove('hidden');
        });

        // 手動終了を確定し、タイマーを止めてリザルト入力を案内する
        if(confirmEndMatchButton) confirmEndMatchButton.addEventListener('click', () => {
            playLongBeep(); 
            if(confirmationModal) confirmationModal.classList.add('hidden');
            if (timerInterval) clearInterval(timerInterval);
            timerRunning = false; 
            if(timerDisplay) {
                timerDisplay.classList.remove('timer-running', 'timer-paused');
                timerDisplay.classList.add('timer-ended');
            }
            handleMatchEnd(false);
        });

        // 手動終了を取り消し、元のタイマー状態を保つ
        if(cancelEndMatchButton) cancelEndMatchButton.addEventListener('click', () => {
            if(confirmationModal) confirmationModal.classList.add('hidden');
        });
        
        /**
         * タイマー操作をロックし、リザルト入力への導線と終了メッセージを表示する。
         * @param {boolean} isTimeout - trueならタイムアウト、falseなら手動終了。
         */
        function handleMatchEnd(isTimeout) {
            // 終了後にタイマーを操作できない状態へ固定する
            if(timerControlsPreStart) timerControlsPreStart.classList.add('hidden'); 
            if(timerControlsActive) timerControlsActive.classList.remove('hidden'); 
            if(startButtonActive) startButtonActive.disabled = true; 
            if(pauseButton) pauseButton.disabled = true;
            if(endMatchButton) endMatchButton.disabled = true; 
            if(resetMatchTimerButton) resetMatchTimerButton.disabled = true; 
            if(timerDisplay) { 
                timerDisplay.classList.remove('timer-running', 'timer-paused');
                timerDisplay.classList.add('timer-ended');
            }

            // 後続のリザルト入力で使う保存領域を先に作る
            getCurrentMatchData();
            
            // リザルト入力画面で終了理由欄の表示判定に使う
            matchEndType = isTimeout ? MATCH_END_TYPES.TIMEOUT : MATCH_END_TYPES.MANUAL;

            // 終了メッセージとリザルト入力ボタンを表示する
            if(proceedToResultContainer) proceedToResultContainer.classList.remove('hidden');

            if (isTimeout) {
                if(recordDisplayOnTimerPage) {
                     recordDisplayOnTimerPage.textContent = "試合終了！リザルト入力へ進んでください。"; 
                     recordDisplayOnTimerPage.classList.add('recorded'); 
                }
            } else {
                if(recordDisplayOnTimerPage) {
                    recordDisplayOnTimerPage.textContent = "試合手動終了。リザルト入力へ進んでください。"; 
                    recordDisplayOnTimerPage.classList.add('recorded');
                }
            }
        }
        
        /**
         * 終了方法に合わせてリザルト入力画面を初期化する。
         * 第2マッチではコートチェンジに合わせて左右のチーム名を入れ替える。
         * @param {string} endType - MATCH_END_TYPES.MANUAL / MATCH_END_TYPES.TIMEOUT / MATCH_END_TYPES.EDIT のいずれか。
         */
        function setupScorePageUI(endType = MATCH_END_TYPES.TIMEOUT) { 
            const scoreSelects = getScoreSelects();
            
            // 第2マッチだけ、画面左にチームB、右にチームAを表示する
            if (currentMatchNumber === 2) {
                if(scoreTeamAName) scoreTeamAName.textContent = confirmedTeamBDisplay; 
                if(scoreTeamBName) scoreTeamBName.textContent = confirmedTeamADisplay; 
            } else {
                if(scoreTeamAName) scoreTeamAName.textContent = confirmedTeamADisplay; 
                if(scoreTeamBName) scoreTeamBName.textContent = confirmedTeamBDisplay; 
            }

            // 前回表示した入力値と中央ボール状態を消す
            scoreSelects.forEach(sel => sel.value = "");
            if (centralBallMovedCheckbox) {
                centralBallMovedCheckbox.checked = false;
                centralBallMovedCheckbox.disabled = false;
            }
            if (centralBallNotMovedCheckbox) {
                centralBallNotMovedCheckbox.checked = false;
                centralBallNotMovedCheckbox.disabled = false;
            }
            updateOrangeBallSelectOptions();

            // 手動終了と編集では終了理由を表示し、タイムアップでは隠す
            if (manualEndReasonContainer) {
                if (endType === MATCH_END_TYPES.MANUAL || endType === MATCH_END_TYPES.EDIT) {
                    // 対象チームと終了理由が揃うまでボール数をロックする
                    manualEndReasonContainer.classList.remove('hidden');
                    populateSelectWithOptions(endedByTeamSelect, 0, true, [
                        {text: confirmedTeamADisplay, value: confirmedTeamA},
                        {text: confirmedTeamBDisplay, value: confirmedTeamB}
                    ]);
                    // 編集時は、この後に保存済みの理由を復元する
                    if (endType !== MATCH_END_TYPES.EDIT) {
                        initializeEndReasonSelects();
                    }
                    endedByTeamSelect.disabled = false;
                    endReasonSelect.disabled = false;
                    scoreSelects.forEach(sel => sel.disabled = true);
                    if(proceedToNextPhaseButton) proceedToNextPhaseButton.disabled = true;

                } else {
                    manualEndReasonContainer.classList.add('hidden');
                    scoreSelects.forEach(sel => sel.disabled = true);
                    if(proceedToNextPhaseButton) proceedToNextPhaseButton.disabled = true;
                }
            }

            // タイムアップでは手動終了由来の状態を残さない
            if (endType === MATCH_END_TYPES.TIMEOUT) {
                const matchData = getCurrentMatchData();
                matchData.status = MATCH_STATUS_TIMEOUT;
                matchData.isColdGame = false;
                matchData.isPenaltyFixedScore = false;
                matchData.penaltyLosingTeam = "";
            }

            updateScoreInputsLockState();
            
            showPage(scoreInputPage);
        }
        
        /**
         * 手動終了の対象チームと理由を現在マッチへ保存し、理由固有の入力制御を適用する。
         */
        function checkManualEndReasonSelection() {
            const selectedReasonValue = endReasonSelect?.value || "";
            const isColdReasonSelected = selectedReasonValue === END_REASON_COLD_GAME;
            updateCentralBallConstraintsForEndReason(selectedReasonValue);

            if (endedByTeamSelect && endReasonSelect && endedByTeamSelect.value && endReasonSelect.value) {
                // 表示用ステータスと判定用フラグを同時に更新する
                const teamValue = endedByTeamSelect.value;
                const reasonValue = selectedReasonValue;
                const teamText = endedByTeamSelect.options[endedByTeamSelect.selectedIndex].text;
                const statusText = `${teamText} - ${reasonValue}`;
                
                const isCold = (reasonValue === END_REASON_COLD_GAME);
                const isPenalty = PENALTY_FIXED_SCORE_REASONS.includes(reasonValue);

                const matchData = getCurrentMatchData();
                matchData.status = statusText;
                matchData.isColdGame = isCold;
                matchData.isPenaltyFixedScore = isPenalty;
                matchData.penaltyLosingTeam = (isCold || isPenalty) ? teamValue : "";

                updateScoreInputsLockState();
            } else {
                // 対象チームまたは理由を外したら、関連する入力と保存状態を消す
                getScoreSelects().forEach(sel => {
                    sel.value = "";
                    sel.disabled = true;
                });
                const matchData = getCurrentMatchData();
                matchData.status = "";
                matchData.isColdGame = false;
                matchData.isPenaltyFixedScore = false;
                matchData.penaltyLosingTeam = "";

                // コールド勝利の固定値は対象チーム選択前でも保ち、それ以外はクリアする
                if (!isColdReasonSelected) {
                    if (centralBallMovedCheckbox) centralBallMovedCheckbox.checked = false;
                    if (centralBallNotMovedCheckbox) centralBallNotMovedCheckbox.checked = false;
                    matchData.centralBallState = "";
                }

                if(proceedToNextPhaseButton) proceedToNextPhaseButton.disabled = true;
            }
        }
        
        // ===================================================================================
        // ボール数入力と勝敗判定
        // ===================================================================================

        /**
         * 片側のボール数から、規定総数を満たす反対側の値を自動入力する。
         * @param {HTMLSelectElement} sourceSelect - 入力元のselect要素。
         * @param {HTMLSelectElement} targetSelect - 自動入力先のselect要素。
         * @param {number} maxTotal - ボールの合計最大数。
         */
        function handleScoreSelectChange(sourceSelect, targetSelect, maxTotal) {
            if (!sourceSelect || !targetSelect) return;
            if (!sourceSelect.disabled) {
                const sourceValue = parseInt(sourceSelect.value);
                if (!isNaN(sourceValue) && sourceValue >= 0 && sourceValue <= maxTotal) { 
                    targetSelect.value = maxTotal - sourceValue;
                } else { 
                    targetSelect.value = "";
                }
            }
            checkIfScoresAreComplete();
        }

        /**
         * 4つのボール数と必要な終了理由が揃ったら、入力値を保存して確定を有効にする。
         */
        function checkIfScoresAreComplete() {
            const valuesToValidate = [];

            valuesToValidate.push(
                teamAOrangeBallsSelect?.value, teamAPurpleBallsSelect?.value,
                teamBOrangeBallsSelect?.value, teamBPurpleBallsSelect?.value
            );

            const manualReasonSelected = manualEndReasonContainer?.classList.contains('hidden')
                || (!!endedByTeamSelect?.value && !!endReasonSelect?.value);
            
            // 数値の0はselect.valueでは文字列"0"となるため、選択済みとして扱われる
            const allSelected = valuesToValidate.every(val => val && val !== "") && manualReasonSelected;
            if(proceedToNextPhaseButton) proceedToNextPhaseButton.disabled = !allSelected;

            // 未完成の入力で保存済みデータを上書きしない
            if(allSelected) { 
                const matchData = getCurrentMatchData();

                let uiOrangeLeftVal = parseInt(teamAOrangeBallsSelect.value);
                let uiPurpleLeftVal = parseInt(teamAPurpleBallsSelect.value);
                let uiOrangeRightVal = parseInt(teamBOrangeBallsSelect.value);
                let uiPurpleRightVal = parseInt(teamBPurpleBallsSelect.value);

                // 画面上の左右ではなく、対戦全体で固定したチームA/Bへ保存する
                if (currentMatchNumber === 2) {
                    matchData.teamB_Orange = uiOrangeLeftVal;
                    matchData.teamB_Purple = uiPurpleLeftVal;
                    matchData.teamA_Orange = uiOrangeRightVal;
                    matchData.teamA_Purple = uiPurpleRightVal;
                } else {
                    matchData.teamA_Orange = uiOrangeLeftVal;
                    matchData.teamA_Purple = uiPurpleLeftVal;
                    matchData.teamB_Orange = uiOrangeRightVal;
                    matchData.teamB_Purple = uiPurpleRightVal;
                }
            }
        }

        /**
         * 通常スコアを「オレンジ数 - 紫数×2」で計算する。
         * RoboSportsでは計算結果が小さいチームを勝者とする。
         * @param {number} orangeBalls - オレンジボール数。
         * @param {number} purpleBalls - 紫ボール数。
         * @returns {number}
         */
        function calculateRegularBallScore(orangeBalls, purpleBalls) {
            return orangeBalls - (purpleBalls * 2);
        }

        /**
         * 自動敗北に該当する場合は敗者9点・勝者-4点を返し、通常時はnullを返す。
         * @param {Object} match - matchesData内の1マッチ分データ。
         * @returns {{teamA: number, teamB: number}|null}
         */
        function getPenaltyFixedScores(match) {
            if (!match.isPenaltyFixedScore) return null;
            return match.penaltyLosingTeam === confirmedTeamA
                ? { teamA: PENALTY_SCORE_FOR_LOSING_TEAM, teamB: PENALTY_SCORE_FOR_WINNING_TEAM }
                : { teamA: PENALTY_SCORE_FOR_WINNING_TEAM, teamB: PENALTY_SCORE_FOR_LOSING_TEAM };
        }

        /**
         * 固定スコアを優先して、1マッチ分の両チームスコアを返す。
         * allowIncompleteがtrueなら、未入力チームの値をnullとして表示側で「-」にできる。
         * @param {Object} match - matchesData内の1マッチ分データ。
         * @param {Object} options - 計算オプション。
         * @param {boolean} options.allowIncomplete - ボール数未入力ならnullを返すかどうか。
         * @returns {{teamA: number|null, teamB: number|null}}
         */
        function calculateMatchScores(match, { allowIncomplete = false } = {}) {
            const penaltyScores = getPenaltyFixedScores(match);
            if (penaltyScores) return penaltyScores;

            const hasTeamAScore = match.teamA_Orange !== undefined && match.teamA_Purple !== undefined;
            const hasTeamBScore = match.teamB_Orange !== undefined && match.teamB_Purple !== undefined;

            return {
                teamA: allowIncomplete && !hasTeamAScore
                    ? null
                    : calculateRegularBallScore(match.teamA_Orange, match.teamA_Purple),
                teamB: allowIncomplete && !hasTeamBScore
                    ? null
                    : calculateRegularBallScore(match.teamB_Orange, match.teamB_Purple)
            };
        }

        /**
         * 小さいスコアのチームIDを返し、同点または比較不能なら引き分けを返す。
         * @param {number|null} teamAScore - チームAのスコア。
         * @param {number|null} teamBScore - チームBのスコア。
         * @returns {string} confirmedTeamA / confirmedTeamB / MATCH_RESULT_DRAW。
         */
        function resolveWinnerByLowerScore(teamAScore, teamBScore) {
            if (teamAScore < teamBScore) return confirmedTeamA;
            if (teamBScore < teamAScore) return confirmedTeamB;
            return MATCH_RESULT_DRAW;
        }

        /**
         * 以前の強調を解除してから、勝者側または引き分けの両側へ強調表示を適用する。
         * @param {string} winner - confirmedTeamA / confirmedTeamB / MATCH_RESULT_DRAW。
         * @param {HTMLElement[]} teamACells - チームA側で強調対象にするセル。
         * @param {HTMLElement[]} teamBCells - チームB側で強調対象にするセル。
         */
        function applyResultHighlight(winner, teamACells, teamBCells) {
            [...teamACells, ...teamBCells].forEach(cell => {
                cell.classList.remove('highlight-winner-cell', 'highlight-draw-cell');
            });

            if (winner === confirmedTeamA) {
                teamACells.forEach(cell => cell.classList.add('highlight-winner-cell'));
            } else if (winner === confirmedTeamB) {
                teamBCells.forEach(cell => cell.classList.add('highlight-winner-cell'));
            } else if (winner === MATCH_RESULT_DRAW) {
                teamACells.forEach(cell => cell.classList.add('highlight-draw-cell'));
                teamBCells.forEach(cell => cell.classList.add('highlight-draw-cell'));
            }
        }

        // ===================================================================================
        // 各マッチの結果確認
        // ===================================================================================

        /**
         * 指定マッチのスコアと勝者を計算し、結果確認画面へ表示する。
         * @param {number} matchIndex - 表示するマッチの配列位置（0〜2）。
         */
        function displayIntermediateResult(matchIndex) {
            const match = matchesData[matchIndex];
            if (!match || !intermediateResultPage) return;

            // マッチ番号と対戦チームを見出しへ反映する
            if(intermediateResultTitle) intermediateResultTitle.textContent = `第${matchIndex + 1}マッチ 結果`;
            if(intermediateMatchTeams) intermediateMatchTeams.textContent = `${confirmedTeamADisplay} vs ${confirmedTeamBDisplay}`;
            
            if(intermediateMatchResultTableBody) intermediateMatchResultTableBody.innerHTML = ''; // 再編集前の行を残さない

            // 保存済みボール数から、固定スコアを含む表示値を求める
            let teamAOrangeIntermediate = match.teamA_Orange;
            let teamAPurpleIntermediate = match.teamA_Purple;
            let teamBOrangeIntermediate = match.teamB_Orange;
            let teamBPurpleIntermediate = match.teamB_Purple;
            const {
                teamA: teamAScoreIntermediate,
                teamB: teamBScoreIntermediate
            } = calculateMatchScores(match);
            
            // 総合結果で勝利数を集計できるよう、マッチの勝者IDを保存する
            match.winner = resolveWinnerByLowerScore(teamAScoreIntermediate, teamBScoreIntermediate);

            // チームA/Bを固定順で1行ずつ表示する
            const rowA = intermediateMatchResultTableBody.insertRow();
            rowA.insertCell().textContent = confirmedTeamADisplay;
            rowA.insertCell().textContent = teamAOrangeIntermediate ?? "-";
            rowA.insertCell().textContent = teamAPurpleIntermediate ?? "-"; 
            rowA.insertCell().textContent = teamAScoreIntermediate ?? "-";

            const rowB = intermediateMatchResultTableBody.insertRow();
            rowB.insertCell().textContent = confirmedTeamBDisplay;
            rowB.insertCell().textContent = teamBOrangeIntermediate ?? "-";
            rowB.insertCell().textContent = teamBPurpleIntermediate ?? "-"; 
            rowB.insertCell().textContent = teamBScoreIntermediate ?? "-";

            // 勝者側の数値、または引き分け時の両側を強調する
            const cellsToHighlightAInter = Array.from(rowA.cells).slice(1);
            const cellsToHighlightBInter = Array.from(rowB.cells).slice(1);
            applyResultHighlight(match.winner, cellsToHighlightAInter, cellsToHighlightBInter);
            
            const matchStatusText = match.status ? `[${match.status}]` : "";

            if (match.winner === confirmedTeamA) {
                if(intermediateMatchWinnerDisplay) {
                    intermediateMatchWinnerDisplay.textContent = `勝者:${matchStatusText ? `${matchStatusText} ` : ""}${confirmedTeamADisplay}`;
                    intermediateMatchWinnerDisplay.style.color = 'green';
                }
            } else if (match.winner === confirmedTeamB) {
                if(intermediateMatchWinnerDisplay) {
                    intermediateMatchWinnerDisplay.textContent = `勝者:${matchStatusText ? `${matchStatusText} ` : ""}${confirmedTeamBDisplay}`;
                    intermediateMatchWinnerDisplay.style.color = 'green';
                }
            } else if (match.winner === MATCH_RESULT_DRAW) {
                if(intermediateMatchWinnerDisplay) {
                    intermediateMatchWinnerDisplay.textContent = "引き分け";
                    intermediateMatchWinnerDisplay.style.color = 'red';
                }
            }

            // 残りマッチがあれば次の配置へ、3マッチ後は総合結果へ案内する
            if(goToNextStepButton) {
                if (currentMatchNumber < TOTAL_MATCHES) {
                    // 第1・第2マッチ後
                    goToNextStepButton.textContent = `第${currentMatchNumber + 1}マッチのボール配置を表示`;
                } else {
                    // 第3マッチ後
                    goToNextStepButton.textContent = "総合結果へ";
                }
            }
            if(editMatchResultButton) {
                editMatchResultButton.textContent = `第${matchIndex + 1}マッチのリザルトを変更`;
            }
            showPage(intermediateResultPage);
        }
        
        // ===================================================================================
        // 総合結果
        // ===================================================================================

        /**
         * 3マッチ分の結果を集計し、モードに応じて総合勝者を決定する。
         */
        function displayResults() {
            if(!resultsPage) return;
            if(resultsTeamsDisplay) resultsTeamsDisplay.textContent = `${confirmedTeamADisplay} vs ${confirmedTeamBDisplay}`;
            if(resultsTableBody) resultsTableBody.innerHTML = ''; 
            
            // 勝者判定とサマリー表示に使う対戦全体の集計値
            let gameTotalWinsTeamA = 0;
            let gameTotalWinsTeamB = 0;
            let gameTotalFoulsTeamA = 0;
            let gameTotalFoulsTeamB = 0;
            let gameTotalOrangeBallsTeamA = 0;
            let gameTotalPurpleBallsTeamA = 0;
            let gameTotalOrangeBallsTeamB = 0;
            let gameTotalPurpleBallsTeamB = 0;

            // 各マッチを集計しながら結果一覧の行を生成する
            for (let i = 0; i < TOTAL_MATCHES; i++) {
                const match = matchesData[i] || {}; 
                const row = resultsTableBody.insertRow();
                
                // 自動敗北に指定されたチームの違反回数を加算する
                if (match.isPenaltyFixedScore === true) { 
                    if (match.penaltyLosingTeam === confirmedTeamA) {
                        gameTotalFoulsTeamA++;
                    } else if (match.penaltyLosingTeam === confirmedTeamB) {
                        gameTotalFoulsTeamB++;
                    }
                }

                // 未入力データにも耐えられる表示値を計算し、入力済みのボール数だけ加算する
                let teamAOrange = match.teamA_Orange;
                let teamAPurple = match.teamA_Purple;
                let teamBOrange = match.teamB_Orange;
                let teamBPurple = match.teamB_Purple;
                const { teamA: teamAScore, teamB: teamBScore } = calculateMatchScores(match, { allowIncomplete: true });

                if (teamAOrange !== undefined) gameTotalOrangeBallsTeamA += teamAOrange;
                if (teamAPurple !== undefined) gameTotalPurpleBallsTeamA += teamAPurple;
                if (teamBOrange !== undefined) gameTotalOrangeBallsTeamB += teamBOrange;
                if (teamBPurple !== undefined) gameTotalPurpleBallsTeamB += teamBPurple;
                
                // 引き分けはどちらの勝利数にも加えない
                if (match.winner === confirmedTeamA) { gameTotalWinsTeamA++; }
                else if (match.winner === confirmedTeamB) { gameTotalWinsTeamB++; }

                // 未入力項目は「-」として表示する
                row.insertCell().textContent = `第${i + 1}マッチ`;
                row.insertCell().textContent = match.status || "-";
                const cellAOrange = row.insertCell(); cellAOrange.textContent = teamAOrange ?? "-";
                const cellAPurple = row.insertCell(); cellAPurple.textContent = teamAPurple ?? "-";
                const cellAScore = row.insertCell(); cellAScore.textContent = teamAScore ?? "-";
                const cellBOrange = row.insertCell(); cellBOrange.textContent = teamBOrange ?? "-";
                const cellBPurple = row.insertCell(); cellBPurple.textContent = teamBPurple ?? "-";
                const cellBScore = row.insertCell(); cellBScore.textContent = teamBScore ?? "-";

                // チーム名以外の数値セルを勝敗に応じて強調する
                const cellsToHighlightA = [cellAOrange, cellAPurple, cellAScore];
                const cellsToHighlightB = [cellBOrange, cellBPurple, cellBScore];
                applyResultHighlight(match.winner, cellsToHighlightA, cellsToHighlightB);
            }

            // 選択中の引き分けモードに従って総合勝者を判定する
            let overallWinner = null;
            let overallDraw = false;
            let winReasonText = "";

            if (selectedMatchMode === MATCH_MODES.PRELIMINARY) {
                // 「引き分け有り」では勝利マッチ数が同じなら総合引き分け
                if (gameTotalWinsTeamA > gameTotalWinsTeamB) {
                    overallWinner = confirmedTeamADisplay;
                    winReasonText = "[勝利マッチ数]";
                } else if (gameTotalWinsTeamB > gameTotalWinsTeamA) {
                    overallWinner = confirmedTeamBDisplay;
                    winReasonText = "[勝利マッチ数]";
                } else {
                    overallDraw = true;
                }
            } else {
                // 「引き分け無」では勝利数、違反数、総ボールスコアの順で比較する
                if (gameTotalWinsTeamA > gameTotalWinsTeamB) {
                    overallWinner = confirmedTeamADisplay;
                    winReasonText = "[勝利マッチ数]";
                } else if (gameTotalWinsTeamB > gameTotalWinsTeamA) {
                    overallWinner = confirmedTeamBDisplay;
                    winReasonText = "[勝利マッチ数]";
                } else {
                    if (gameTotalFoulsTeamA < gameTotalFoulsTeamB) {
                        overallWinner = confirmedTeamADisplay;
                        winReasonText = "[総違反回数]";
                    } else if (gameTotalFoulsTeamB < gameTotalFoulsTeamA) {
                        overallWinner = confirmedTeamBDisplay;
                        winReasonText = "[総違反回数]";
                    } else {
                        const overallScoreTeamA = gameTotalOrangeBallsTeamA - (gameTotalPurpleBallsTeamA * 2);
                        const overallScoreTeamB = gameTotalOrangeBallsTeamB - (gameTotalPurpleBallsTeamB * 2);
                        if (overallScoreTeamA < overallScoreTeamB) { // 総ボールスコアも小さい側を勝者とする
                            overallWinner = confirmedTeamADisplay;
                            winReasonText = "[総ボールスコア]";
                        } else if (overallScoreTeamB < overallScoreTeamA) {
                            overallWinner = confirmedTeamBDisplay;
                            winReasonText = "[総ボールスコア]";
                        } else {
                            overallDraw = true;
                        }
                    }
                }
            }

            // チーム別の集計表を生成する
            if (summaryStatsContainer) {
                summaryStatsContainer.innerHTML = `
                    <h3 class="font-bold mb-2 mt-4 text-xl">総計</h3>

                            <tr id="summaryRowTeamB">

                // 総合勝者は行全体、引き分けは両チーム名を強調する
                const summaryRowTeamA = document.getElementById('summaryRowTeamA');
                const summaryRowTeamB = document.getElementById('summaryRowTeamB');
                const summaryNameTeamA = document.getElementById('summaryNameTeamA');
                const summaryNameTeamB = document.getElementById('summaryNameTeamB');

                if (overallWinner === confirmedTeamADisplay && summaryRowTeamA) {
                    summaryRowTeamA.classList.add('overall-winner-row');
                } else if (overallWinner === confirmedTeamBDisplay && summaryRowTeamB) {
                    summaryRowTeamB.classList.add('overall-winner-row');
                } else if (overallDraw && summaryNameTeamA && summaryNameTeamB) {
                    summaryNameTeamA.classList.add('overall-draw-team-name');
                    summaryNameTeamB.classList.add('overall-draw-team-name');

            // 最後に採用した判定基準と総合勝者を表示する
            if(overallWinnerDisplay) {
